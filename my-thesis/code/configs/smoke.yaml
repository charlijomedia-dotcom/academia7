# Smoke-test overrides (C§10).
#
# The smoke test validates code paths only. Its outputs go to the smoke namespace and may
# never be mixed with thesis baseline outputs (C§10, [D16]).
#
# Targets: INDPRO (monthly) and GDPC1 (quarterly). Both are complete in the approved
# vintage, so the smoke test neither depends on nor prejudges the open N1 decision about
# the 2025-10 gap in CPIAUCSL and UNRATE.

smoke:
  enabled: true
  targets: ["INDPRO", "GDPC1"]
  # Short out-of-sample block: the last N origins only (C§10 requires a *fast* mode).
  # The approved rolling-window lengths are kept unchanged, so the smoke run still
  # exercises the real 240/120 baseline and the real 180/240/300 and 90/120/150
  # sensitivity boundaries; only the number of origins is cut.
  max_origins: 6
  # The monthly VAR block still loads all five monthly series, but forecasts only the
  # smoke subset.
  var_enabled: true

forecasting:
  star_multistep:
    paths: 200          # reduced from 5000 for speed; smoke output is never thesis-facing

evaluation:
  mcs:
    replications: 200   # reduced from 5000
  hlz:
    # Reduced from the article's 50,000 so the smoke run is fast. Smoke critical values
    # are approximate by construction and are never thesis-facing ([D16]).
    critical_value_replications: 2000

execution:
  parallel_workers: 2
