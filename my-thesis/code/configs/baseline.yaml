# Baseline methodology parameters.
#
# Every value here is fixed by the approved Part 5 methodology or by a recorded decision
# in notes/claude/part6_issues_and_decisions.md. Nothing in this file may be changed
# because it improves an empirical result (CLAUDE.md §6).
#
# Citations in comments point at the authority for each value:
#   S§n   = part5_methodology_specification.md section n
#   C§n   = part5_computational_execution_spec.md section n
#   O§n   = part5_required_outputs_specification.md section n
#   [ID]  = decision ID in part6_issues_and_decisions.md

run:
  master_seed: 20261005        # fixed once; all child seeds derive from it (C§8)
  vintage_date: "2026-10-05"   # S§2.2 thesis vintage
  provider: "FRED/ALFRED"

retrieval:
  # T6: vintage_dates is the primary request form; realtime is the audit cross-check.
  primary_request: "vintage_dates"
  audit_request: "realtime"
  units: "lin"                 # raw levels only, no provider-side transformation (S§2.2)
  api_base: "https://api.stlouisfed.org/fred/series/observations"
  api_key_env: "FRED_API_KEY"  # never hard-coded, never logged (S§2.2)
  timeout_seconds: 120
  max_retries: 3

samples:
  # Approved usable ranges (S§2.4). These are authoritative.
  monthly_end: "2026-08-01"    # common monthly endpoint 2026M8
  quarterly_end: "2026-04-01"  # 2026Q2
  var_start: "1959-01-01"      # M2 is the latest-starting monthly component
  var_end: "2026-08-01"

  # Raw ranges observed in the 2026-10-05 vintage, verified 2026-10-09.
  # check_expected_ranges() halts on any deviation from these.
  verified_raw:
    GDPC1:    {first: "1947-01-01", last: "2026-04-01", rows: 318}
    CPIAUCSL: {first: "1947-01-01", last: "2026-08-01", rows: 956}
    UNRATE:   {first: "1948-01-01", last: "2026-09-01", rows: 945}
    INDPRO:   {first: "1919-01-01", last: "2026-08-01", rows: 1292}
    FEDFUNDS: {first: "1954-07-01", last: "2026-09-01", rows: 867}
    M2SL:     {first: "1959-01-01", last: "2026-08-01", rows: 812}
    USREC:    {first: "1854-12-01", last: "2026-09-01", rows: 2062}

  # Deviations from the Part 5 rationale text that are explained and accepted.
  accepted_raw_deviations:
    FEDFUNDS:
      note: >-
        [N2] The rationale text states FEDFUNDS was available only through 2026M8; the
        vintage actually carries 2026M9. The operative endpoint rule (latest month
        jointly available across the five monthly targets) still yields 2026M8 because
        CPI, INDPRO and M2 end in August, so the approved endpoint is unaffected. The
        extra month is frozen as returned and truncated when the sample is built [T5].
    UNRATE:
      note: >-
        [T5] UNRATE carries 2026M9 as Part 5 anticipates. Frozen as returned, truncated
        to the approved 2026M8 endpoint when the sample is built.

  # Permanent interior gaps observed in the approved vintage.
  known_missing:
    CPIAUCSL: ["2025-10-01"]
    UNRATE: ["2025-10-01"]

# [N1 RESOLVED 2026-10-13 by user-approved Part 5 amendment, S section 2.2A]
# Last observation carried forward at the RAW LEVEL stage, applied once, before any
# transformation, difference, lag construction or estimation, and ONLY in the derived
# canonical model-input CSV. The official raw snapshot keeps its missing-value markers.
# These two cells are the ONLY imputation permitted anywhere in the pipeline.
missing_data_policy:
  rule: locf_raw_level
  authority: "part5_methodology_specification.md section 2.2A (13 October 2026)"
  applies_only_to:
    - {series_id: CPIAUCSL, date: "2025-10-01", source_date: "2025-09-01"}
    - {series_id: UNRATE,   date: "2025-10-01", source_date: "2025-09-01"}
  observation_status_flag: IMPUTED_LOCF
  method_label: LOCF
  # Each is applied if and only if the official raw October value is missing and the
  # September predecessor exists. Any other pattern is a documented stop, never a
  # silent substitution.
  halt_conditions:
    - official_october_value_present
    - september_predecessor_missing
    - unexpected_missing_values_elsewhere
    - duplicate_dates
    - inconsistent_vintage_values
  # Stated consequences that Part 8/9 must disclose (S 2.2A):
  known_artifacts:
    - "October 2025 CPI monthly inflation is exactly zero by construction"
    - "the observed September-to-November index change loads entirely on November"
    - "if UNRATE is differenced, its October 2025 change is exactly zero by construction"

# Canonical author-processed research input (S section 2.2A; Outputs T2.0B).
canonical_input:
  csv: "thesis_input_2026-10-05.csv"
  metadata: "thesis_input_2026-10-05.metadata.json"
  readme: "thesis_input_2026-10-05.README.md"
  manifest: "thesis_input_2026-10-05.manifest.json"
  format: long
  columns:
    - series_id
    - date
    - frequency
    - value
    - source_value
    - observation_status
    - imputation_method
    - imputation_source_date
  sort_by: [series_id, date]
  encoding: utf-8
  line_terminator: "\n"
  date_format: "%Y-%m-%d"
  # No transformed growth rates, forecasts or future data may be appended (S 2.2A).
  contains_transformations: false

targets:
  GDPC1:
    frequency: Q
    start: "1947-01-01"
    transform: {kind: logdiff_annualized, k: 400}     # S§2.3
    role: baseline
  CPIAUCSL:
    frequency: M
    start: "1947-01-01"
    transform: {kind: logdiff_annualized, k: 1200}
    role: baseline
  UNRATE:
    frequency: M
    start: "1948-01-01"
    transform: {kind: decided_by_stationarity_rule}   # S§3.4
    role: baseline
  INDPRO:
    frequency: M
    start: "1947-01-01"                               # deliberate truncation, S§2.4
    truncated: true
    transform: {kind: logdiff_annualized, k: 1200}
    role: baseline
  FEDFUNDS:
    frequency: M
    start: "1954-07-01"
    transform: {kind: decided_by_stationarity_rule}
    role: baseline
  M2SL:
    frequency: M
    start: "1959-01-01"
    transform: {kind: logdiff_annualized, k: 1200}
    role: baseline
  USREC:
    frequency: M
    start: "1854-12-01"
    # S§2.5 uses USREC only to classify forecast target dates, so the canonical input
    # carries it over the monthly study span rather than its full 1854 history.
    canonical_start: "1947-01-01"
    transform: {kind: none}
    role: evaluation_only                             # never a regressor, S§2.5

stationarity:                                          # S§3.2, [D9]
  significance: 0.05
  adf:
    regression: "c"
    autolag: "BIC"
    maxlag: {M: 12, Q: 4}
  kpss:
    regression: "c"
    nlags: "auto"
  zivot_andrews:
    regression: "ct"        # break in intercept and trend
    trim: 0.15
    autolag: "BIC"
    maxlag: {M: 12, Q: 4}
    applies_to: ["UNRATE", "FEDFUNDS"]
  # [T2] intercept-only is the traceable baseline; constant+trend is an extra diagnostic
  # on log levels that may not change any baseline decision.
  extra_trend_diagnostic: true

nonlinearity:                                          # S§4
  significance: 0.05
  tsay:
    variant: "quadratic_F"                             # [D3]
  lst:
    delays: {M: [1, 2, 3, 4, 5, 6], Q: [1, 2, 3, 4]}
    variant: "F"
    tie_break: "smallest_delay"                        # [D4] deterministic
    multiplicity_correction: none                      # S§4.2

specification:                                         # S§5.1, S§5.2
  ar:
    max_lag: {M: 12, Q: 4}
    criterion: "BIC"
    common_effective_sample: true                      # [D2]
  arma:
    grid: {M: {p: [0, 4], q: [0, 4]}, Q: {p: [0, 2], q: [0, 2]}}
    exclude_zero_zero: true
    require_stationary_invertible: true
    flag_pure_ar_or_ma: true                           # [M4]
    criterion: "BIC"
  residual_screen:
    test: "ljung_box"
    primary_lag: {M: 12, Q: 4}                         # [D1]
    secondary_lag: {M: 24, Q: 8}
    significance: 0.05

models:
  msar:
    regimes_baseline: 2                                # S§5.5
    regimes_robustness: 3                              # S§11.1, [M8]
    lag_cap: {M: 4, Q: 4}
    switching: "mean_only"                             # common AR coefficients and variance
    order_regimes_by: "mean"                           # label-switching rule, S§8.1
  star:
    lag_cap: {M: 4, Q: 2}                              # S§5.6
    types: ["LSTAR", "ESTAR"]
    # [D5] scale-free parameterization on (z - c) / s_z
    gamma_bounds: [0.001, 1000.0]
    standardize_transition_variable: true
  var:                                                 # S§6.1, [M10]
    variables: ["CPIAUCSL", "INDPRO", "UNRATE", "FEDFUNDS", "M2SL"]
    lags: [1, 2, 3]
    criterion: "BIC"
    require_stability: true
  arma_garch:                                          # S§5.3, [M9]
    enabled: true
    order: {p: 1, q: 1}
    trigger: "arch_lm_rejects_on_selected_arma_initial_window"
    in_horse_race: false
    in_mcs: false

diagnostics:
  ljung_box_lags: {M: [12, 24], Q: [4, 8]}             # S§7.3
  arch_lm_lags: {M: 12, Q: 4}
  jarque_bera: true
  # [D1] df conventions
  ljung_box_df:
    ar: "ar_params"
    arma: "p_plus_q"
    nonlinear: "none_documented"

forecasting:                                           # S§9
  windows: {M: 240, Q: 120}            # baseline (S section 9.1)
  # After the approved LOCF the monthly panel has no interior gaps, so a window of 240
  # observations and one of 240 calendar months are the same window.
  window_unit: observations_equal_calendar_periods
  horizons:
    primary: {M: 1, Q: 1}
    robustness: {M: [3, 6, 12], Q: [2, 4]}
  multistep: "iterated"
  star_multistep:                                      # [M2]
    method: "residual_bootstrap"
    paths: 5000
    analytic_at_h1: true
    skeleton_diagnostic: true
  msar_multistep: "exact_state_recursion"
  refit: "every_origin"                                # S§9.2
  specification_fixed_from: "initial_window"           # [T7] first 240/120 observations
  warm_starts: true                                    # C§7

evaluation:                                            # S§10
  losses: ["squared", "absolute"]
  benchmark: "AR"
  loss_differential: "competitor_minus_benchmark"      # [D12]
  pairs:                                               # S§10.2
    - ["AR", "ARMA"]
    - ["AR", "MSAR"]
    - ["AR", "STAR"]
    - ["ARMA", "MSAR"]
    - ["ARMA", "STAR"]
  alignment: "pairwise_intersection_of_valid_dates"    # [M7]
  hlz:
    # [M3] Harvey, Leybourne and Zu (2025), JBES 43(3), 643-656.
    # Every value below is taken from the article and its supplementary appendix, both
    # held with checksums in source-materials/hlz2025/. Nothing here is inferred.
    #
    # Structure (article eq. 4 and p.648; supplement Theorem 4, Appendix C):
    #   m_hat_t    = sum_s w_ts d_s,  w_ts = K((s-t)/(nh)) / sum_s K((s-t)/(nh))
    #   Omega_hat' = n^-1 sum_t sum_s (d_t - m_hat_t)(d_s - m_hat_s) k((t-s)/b)
    #   DM'        = sqrt(n) * d_bar / sqrt(Omega_hat')
    #   V_hat_m    = (1/n) sum m_hat_t^2 - ((1/n) sum m_hat_t)^2        (article eq. 5)
    #
    # Kernels and bandwidths: article §5 p.649, adopted "throughout the remainder of the
    # article" and used unchanged in the empirical applications (§6 p.653).
    source: "Harvey, Leybourne & Zu (2025), JBES 43(3), 643-656, section 5 (p.649)"
    lrv_kernel: "quadratic_spectral"       # k(.), chosen for its optimality properties
    lrv_bandwidth:
      rule: "b0 * n**(1/3)"                # satisfies b = O(n^tau_b), 0 < tau_b < 1/2
      b0: 1.5
    demean_kernel: "gaussian"              # K(.) for the local mean estimator
    demean_bandwidth:
      rule: "h0 * n**(-2/5)"               # satisfies h = O(n^-tau_h), 1/3 < tau_h < 2/3
      h0: 0.25
    # Finite-sample null critical values: supplement Appendix C. Simulate iid N(0,1)
    # d*_t of the actual length n, recompute DM' with the same kernels and bandwidths,
    # and take empirical quantiles. Article §5 p.649 uses 50,000 replications.
    critical_value_scheme: "appendix_C_iid_normal"
    critical_value_replications: 50000
    critical_value_seed: 20261005
    # The formal test (Theorems 2 and 5) is two-sided; the applications in §6 also report
    # one-sided tail p-values. Both are produced; the two-sided result is the headline.
    two_sided: true
    report_one_sided: true
    # Standardized mean-variation diagnostic V_hat_m / Omega_hat' reported in the
    # article's Tables 3 and 4. It shows how much loss-differential mean variation is
    # actually present, which is the condition that motivates using HLZ at all.
    report_mean_variation_ratio: true
  dm_hln:                                              # S§10.3, [D10]
    hac_kernel: "bartlett"
    truncation: "h_minus_1"
    small_sample_correction: "harvey_leybourne_newbold"
    reference: "student_t"
    two_sided: true
  mcs:                                                 # S§10.4, [D11]
    method: "R"
    bootstrap: "stationary"
    replications: 5000
    block_length_rule: "ceil_sqrt_T_common"
    confidence_levels: [0.90, 0.95]
    seed: 20261005
  state_loss_regression:                               # [M1] NOT labelled Giacomini-White
    label: "ex-post state-dependent forecast-loss regression"
    regressors: ["REC", "TURN"]
    hac_kernel: "bartlett"
    truncation: "h_minus_1"
    report_joint_wald: true          # alpha = beta_rec = beta_turn = 0
    report_slopes_wald: true         # beta_rec = beta_turn = 0
  states:                                              # S§2.5, [M11]
    turning_window_baseline: {M: 3, Q: 1}
    turning_window_sensitivity: {M: [1, 3, 6], Q: [0, 1, 2]}
    union_overlapping_windows: true
    clip_at_sample_boundaries: true
    allow_category_overlap: true

robustness:                                            # S§11
  transformation:
    applies_to: ["UNRATE", "FEDFUNDS"]
    report_level_errors: true                          # [M6]
  cpi_lags:
    label: "CPI AR-lag benchmark robustness"           # [T1]
    series: "CPIAUCSL"
    ar_orders: [1, 3, 6, 12]
    vary_only: "AR"                                    # ARMA/MSAR/STAR stay at baseline
    common_forecast_dates: true
  k3:
    targets: "all"                                     # [M8]
    horizons: "primary_and_robustness"
  horizons: {use_stored_forecasts: true}
  var: {compare_on: "identical_common_target_dates"}   # [M10]
  turning_point_windows: {use: "evaluation.states.turning_window_sensitivity"}
  # Mandatory estimation-window-length sensitivity (S section 9.5 amendment of
  # 12 October 2026; Outputs T4.8/F4.8). Predeclared +/-25% around the baseline;
  # sensitivity scenarios, NOT estimated optimal window sizes.
  window_lengths:
    label: "estimation-window-length robustness"
    lengths: {M: [180, 240, 300], Q: [90, 120, 150]}
    baseline: {M: 240, Q: 120}
    models: ["AR", "ARMA", "MSAR", "STAR"]
    horizon: 1                       # primary h=1 only
    targets: all
    # Discrete specifications stay exactly as selected on the baseline initial window.
    reuse_baseline_discrete_specs: true
    research_specs_per_length: false
    # Parameters are re-estimated at every origin from that origin's trailing window.
    refit: every_origin
    # Comparison calendar starts only when the longest candidate window is available.
    common_calendar_from: longest_window
    predictive_tests: ["HLZ", "DM_HLN", "MCS"]
    conclusion_categories: ["unchanged", "weakened", "reversed", "unavailable"]
    support_change_field: true
    never_overwrite_baseline: true
    outputs:
      comparison: "window_length_comparison.csv"
      predictive_tests: "window_length_predictive_tests.csv"
      origin_audit: "window_length_origin_audit.csv"
      figure: "F4.8_window_length_sensitivity"
  # October 2025 LOCF influence and forecast-exposure diagnostic (Outputs T4.9).
  locf_exposure:
    label: "October 2025 LOCF influence and forecast-exposure diagnostic"
    output: "locf_forecast_exposure.csv"
    flags:
      - target_imputed
      - target_transformation_uses_imputed_predecessor
      - predictor_lag_contains_imputed
      - estimation_window_contains_imputed
    # Descriptive comparison on (a) full approved dates and (b) unaffected pre-gap dates.
    comparison_samples: ["full_approved", "pre_gap_unaffected"]
    # Headline inference stays on the full sample; the subsample is descriptive only and
    # must document its power limitations. Never grounds for changing the endpoint or
    # the LOCF assumption after seeing results.
    headline_inference_sample: full_approved

reporting:
  significance_stars: {0.10: "*", 0.05: "**", 0.01: "***"}   # S§13.2
  exact_p_values: true
  acf_confidence: 0.95
  cross_correlation_figures: false                     # [D20]
  figure_formats: ["png", "pdf"]
  figure_dpi: 300

execution:
  parallel_workers: 4
  blas_threads_per_worker: 1
  checkpoint: true
  cache: true
