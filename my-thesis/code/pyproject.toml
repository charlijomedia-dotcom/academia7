[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis"
version = "0.1.0"
description = "Empirical pipeline for the approved Part 5 methodology (Parts 6-8)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "statsmodels",
    "arch",
    "matplotlib",
    "pyarrow",
    "psutil",
    "joblib",
    "PyYAML",
    "tabulate",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["error::RuntimeWarning"]
markers = [
    "slow: validation runs that estimate models on simulated data",
    "network: requires live FRED access (never part of the default run)",
]
